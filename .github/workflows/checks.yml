name: 🧪 Checks

# Reusable: pull-request-checks.yml, sanity-check.yml and publish.yml all call
# this, so the three can never drift from each other. Each job mirrors one
# script that `bun run ci` runs, fanned out so they finish in parallel.
#
# GitHub shows a check as `<workflow> / <caller job> / <job here> (<event>)` and
# truncates it, so the job names below stay short and put what tells one job
# from its siblings first: `🧪 Tests: branch sync · py3.14 · 🍎 macOS`.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  static:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - { check: lint, label: 🔍 Lint, uv: true }
          - { check: format, label: 🎨 Format, uv: true }
          - { check: executable, label: 🔐 Executable bits, uv: false }
          - { check: shebang, label: 🪄 Shebangs, uv: false }

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 🐰 Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: 🐍 Set up uv
        if: matrix.uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: requirements-dev.txt

      - name: ${{ matrix.label }}
        run: bun run ${{ matrix.check }}

  test:
    name: '🧪 Tests: ${{ matrix.label }} · py${{ matrix.python }} · ${{ matrix.platform }}'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The scripts run on macOS day to day, under whichever python3 >= 3.12
        # install.sh finds, so cover both runners and every version it accepts.
        os: [ubuntu-latest, macos-latest]
        python: ['3.12', '3.13', '3.14']
        # test_sync_all_branches is about two thirds of the suite's runtime, so
        # it gets a shard to itself. Everything else, new suites included, runs
        # in the other.
        suite: [branch-sync, everything-else]
        include:
          - suite: branch-sync
            label: branch sync
            args: test/test_sync_all_branches.py
          - suite: everything-else
            label: everything else
            args: --ignore=test/test_sync_all_branches.py
          - os: ubuntu-latest
            platform: 🐧 Linux
          - os: macos-latest
            platform: 🍎 macOS

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 🐰 Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # python-version exports UV_PYTHON, which `bun run test` (uv run) honours.
      - name: 🐍 Set up uv and Python ${{ matrix.python }}
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-python: true
          cache-dependency-glob: requirements-dev.txt

      - name: 🧪 Run ${{ matrix.label }} tests
        run: bun run test ${{ matrix.args }}
