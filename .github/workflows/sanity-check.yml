name: ✅ Sanity check

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: 🧪 Checks
    uses: ./.github/workflows/checks.yml

  report:
    name: 📝 Report
    needs: checks
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: 🎉 All clear
        if: needs.checks.result == 'success'
        run: echo "✅ ${GITHUB_SHA:0:7} landed on \`main\` clean." >> "$GITHUB_STEP_SUMMARY"

      - name: 🚨 Something broke
        if: needs.checks.result != 'success'
        run: |
          echo "💥 ${GITHUB_SHA:0:7} broke \`main\`, check the failed job above." >> "$GITHUB_STEP_SUMMARY"
          exit 1
