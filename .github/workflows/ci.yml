name: CI

on:
  push:
    branches:
      - '**'

jobs:
  checks:
    name: 🧪 Python script checks
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐰 Install bun
        uses: oven-sh/setup-bun@v2

      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@v5

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🔍 ruff check
        run: bun run lint

      - name: 🎨 ruff format
        run: bun run format

      - name: 📝 syntax
        run: bun run syntax

      - name: 🔑 executable
        run: bun run executable

      - name: 👉 shebang
        run: bun run shebang

      - name: 🧪 pytest
        run: bun run test

      - name: ✅ All checks passed
        run: echo "All Python script checks passed."
